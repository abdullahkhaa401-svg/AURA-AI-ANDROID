name: AURA AI Android APK Builder

'on':
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Locate Android Project
    id: project
    run: |
      PROJECT_DIR=$(find . -type f -name settings.gradle.kts -not -path './.git/*' | head -n 1 | xargs dirname)
      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: settings.gradle.kts not found"
        exit 1
      fi
      if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
        echo "ERROR: app/build.gradle.kts not found"
        exit 1
      fi
      echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

  - name: Build Android APK
    working-directory: ${{ steps.project.outputs.dir }}
    run: gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: AURA-AI-Android-APK
      path: '**/build/outputs/apk/debug/*.apk'
      if-no-files-found: error
      retention-days: 14
