name: AURA AI Android APK Builder

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AURA_AI_v0.21.0_Development.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          test -f AURA_AI_v0.21.0_Development.zip
          mkdir -p source
          unzip -q AURA_AI_v0.21.0_Development.zip -d source

      - name: Verify project files
        run: |
          test -f source/settings.gradle.kts
          test -f source/build.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURA-AI-v0.21.0-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
